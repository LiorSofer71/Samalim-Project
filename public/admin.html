<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ניהול תוצאות - שאלון סגנונות ניהול</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--inner:#f7f8fa;--tx:#1b2433;--mut:#64708a;--bd:#d9dfeb;--ac:#2f5bd8;--acs:#e6edff;--er:#fdecea;--erx:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141c;--card:#1a212d;--inner:#141a24;--tx:#e8ecf4;--mut:#93a0b8;--bd:#2d3748;--ac:#7b9cff;--acs:#243257;--er:#3a1f1f;--erx:#ff9b93}}
:root[data-theme="dark"]{--bg:#10141c;--card:#1a212d;--inner:#141a24;--tx:#e8ecf4;--mut:#93a0b8;--bd:#2d3748;--ac:#7b9cff;--acs:#243257;--er:#3a1f1f;--erx:#ff9b93}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Heebo",Arial,sans-serif;line-height:1.6}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:var(--card);border-bottom:1px solid var(--bd)}
.title{font-weight:700}.mut{color:var(--mut)}
.wrap{max-width:700px;margin:0 auto;padding:20px 16px 30px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:24px}
.inner{background:var(--inner);border-radius:12px;padding:16px;margin:18px 0}
h1{font-size:1.6rem;margin:.1em 0 .5em}h2{font-size:1.2rem;margin:0 0 .6em}p{margin:.5em 0}
label{display:block;font-weight:700;margin-bottom:8px}
input{width:100%;padding:12px;font:inherit;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
button{font:inherit;cursor:pointer;border-radius:10px;padding:11px 18px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
button.block{width:100%}button:disabled{opacity:.45;cursor:not-allowed}
.hide{display:none!important}
.err{background:var(--er);color:var(--erx);padding:10px 12px;border-radius:10px;margin-top:10px;font-size:.9rem}
.prog{display:flex;justify-content:space-between;font-size:.9rem;color:var(--mut);margin-bottom:6px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-bottom:14px}.bar i{display:block;height:100%;background:var(--ac);transition:width .25s}
.qnav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chip{width:34px;height:34px;padding:0;border-radius:8px;font-size:.85rem}
.chip.done{background:var(--acs);border-color:var(--ac)}.chip.now{background:var(--ac);color:#fff;border-color:var(--ac)}
.stem{font-size:1.25rem;font-weight:700;margin-bottom:6px}
.hintq{font-size:.85rem;color:var(--mut);margin-bottom:8px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:right;margin:10px 0;padding:14px;border:2px solid var(--bd);border-radius:12px}
.opt.on{border-color:var(--ac);background:var(--acs)}
.badge{flex:none;width:32px;height:32px;border-radius:50%;border:2px dashed var(--bd);display:grid;place-items:center;font-weight:700}
.opt.on .badge{background:var(--ac);border:2px solid var(--ac);color:#fff}
.row{display:flex;gap:10px;justify-content:space-between;margin-top:20px;flex-wrap:wrap}
.spin{width:40px;height:40px;margin:10px auto;border:4px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
.hero{text-align:center;margin-bottom:16px}.hn{font-size:1.5rem;font-weight:800}
.tie{background:var(--acs);padding:12px;border-radius:10px;margin-bottom:14px;font-size:.9rem}
.brow{display:grid;grid-template-columns:130px 1fr 80px;gap:10px;align-items:center;margin:10px 0}
.bl{font-size:.9rem;line-height:1.3}.bl span{display:block;font-size:.75rem}
.bt{height:16px;background:var(--bd);border-radius:8px;overflow:hidden}.bt i{display:block;height:100%;border-radius:8px}
.bv{font-weight:700;text-align:center;line-height:1.2}.bv small{display:block;font-weight:400;font-size:.7rem;color:var(--mut)}
.spot{border:2px solid;border-radius:14px;padding:16px;margin-top:16px;position:relative}
.spot.secondary{opacity:.92}
.tag{display:inline-block;color:#fff;padding:2px 12px;border-radius:20px;font-size:.8rem;font-weight:600}
.spot h3{margin:8px 0 0;font-size:1.25rem}.eng{color:var(--mut);font-size:.85rem;margin-bottom:6px}
.spot ul{margin:6px 0 0;padding-right:20px}.spot li{margin:4px 0}
.foot{text-align:center;color:var(--mut);font-size:.8rem;padding:10px 0 24px}
table{width:100%;border-collapse:collapse;font-size:.85rem}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:right}.tw{overflow-x:auto}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}
select{padding:12px;font:inherit;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
a{color:var(--ac)}#atbl button{padding:4px 10px;font-size:.8rem;color:#b3261e}
.cs{margin-top:22px}.cs h2{margin-bottom:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.box{border-radius:12px;padding:14px;border:1px solid var(--bd)}
.box.good{background:rgba(46,125,50,.1);border-color:rgba(46,125,50,.4)}
.box.bad{background:rgba(192,57,43,.1);border-color:rgba(192,57,43,.4)}
.box h4{margin:0 0 8px;font-size:1rem}.box ul{margin:0;padding-right:18px}.box li{margin:6px 0}
.bridge{background:var(--acs);border-radius:12px;padding:14px}
.bridge ul{margin:6px 0 0;padding-right:18px}.bridge li{margin:6px 0}
.final{margin-top:22px;border:2px solid var(--ac);border-radius:14px;padding:16px}
.final h2{margin-top:0}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.fc{border-radius:10px;padding:10px;border:2px solid var(--bd);font-size:.9rem}
.fc b{display:block}
@media(max-width:480px){.two{grid-template-columns:1fr}}
@media(max-width:480px){.brow{grid-template-columns:90px 1fr 64px}}
</style>
</head>
<body>
<header class="top"><div class="title">ניהול תוצאות שאלון</div><a href="/">חזרה לשאלון</a></header>
<div class="wrap">

<section id="s-login" class="card">
  <h1>כניסת מנהל</h1>
  <p>הזן/י את סיסמת הניהול כדי לצפות בתוצאות שנאספו.</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="סיסמה">
  <div id="pwErr" class="err hide">סיסמה שגויה, נסה/י שוב.</div>
  <div class="row"><span></span><button class="pri" id="pwBtn">כניסה</button></div>
</section>

<section id="s-admin" class="card hide">
  <h1>תוצאות שנאספו</h1>
  <div class="filters">
    <input id="fName" placeholder="חיפוש לפי שם">
    <select id="fDom"><option value="">סגנון בולט: הכול</option></select>
    <select id="fSec"><option value="">סגנון משני: הכול</option></select>
  </div>
  <div class="row" style="margin-top:12px;justify-content:flex-start">
    <button id="fReset">איפוס סינון</button><button id="csv">ייצוא ל-CSV</button><button id="refresh">רענון</button>
  </div>
  <p class="mut" id="cnt"></p>
  <div class="tw"><table id="atbl"></table></div>
  <p class="mut" id="aMsg">טוען נתונים...</p>
</section>
</div>
<script>
const NAMES={P:'היצרן',A:'המינהלן',E:'היזם',I:'המתכלל'};
const KEYS=['P','A','E','I'];
const $=id=>document.getElementById(id);
let pw='',rowsAll=[];
const hdr=()=>({'Authorization':'Bearer '+pw});
async function load(){
  $('aMsg').textContent='טוען נתונים...';$('aMsg').classList.remove('hide');
  const r=await fetch('/api/results',{headers:hdr()});
  if(r.status===401)return 401;
  if(!r.ok){$('aMsg').textContent='שגיאה בטעינת הנתונים.';return r.status}
  rowsAll=await r.json();renderRows();return 200;
}
async function login(){
  pw=$('pw').value;
  const st=await load();
  if(st===401){$('pwErr').classList.remove('hide');return}
  $('s-login').classList.add('hide');$('s-admin').classList.remove('hide');
}
$('pwBtn').onclick=login;$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
KEYS.forEach(k=>['fDom','fSec'].forEach(id=>{const o=document.createElement('option');o.value=k;o.textContent=NAMES[k];$(id).appendChild(o)}));
['fName','fDom','fSec'].forEach(id=>$(id).addEventListener('input',renderRows));
$('fReset').onclick=()=>{$('fName').value='';$('fDom').value='';$('fSec').value='';renderRows()};
$('refresh').onclick=load;
const fmt=iso=>{try{return new Date(iso).toLocaleString('he-IL',{dateStyle:'short',timeStyle:'short'})}catch(e){return iso||''}};
function filtered(){
  const n=$('fName').value.trim().toLowerCase(),d=$('fDom').value,sc=$('fSec').value;
  return rowsAll.filter(r=>(!n||(r.fullName||'').toLowerCase().includes(n))&&(!d||r.dominant===d)&&(!sc||r.secondary===sc))
    .sort((a,b)=>(b.submittedAt||'').localeCompare(a.submittedAt||''));
}
function renderRows(){
  const rows=filtered(),t=$('atbl');t.innerHTML='';
  $('cnt').textContent=rows.length+' מתוך '+rowsAll.length+' תוצאות';
  if(!rows.length){$('aMsg').textContent='לא נמצאו תוצאות התואמות לסינון.';$('aMsg').classList.remove('hide');return}
  $('aMsg').classList.add('hide');
  const hr=t.insertRow();['שם מלא','תאריך מילוי','P','A','E','I','סגנון בולט','סגנון משני',''].forEach(h=>{const c=document.createElement('th');c.textContent=h;hr.appendChild(c)});
  rows.forEach(r=>{
    const tr=t.insertRow(),T=r.totals||{};
    [r.fullName,fmt(r.submittedAt),T.P,T.A,T.E,T.I,NAMES[r.dominant],NAMES[r.secondary]].forEach(v=>{tr.insertCell().textContent=v??''});
    const b=document.createElement('button');b.textContent='מחיקה';
    b.onclick=async()=>{
      if(b.dataset.c!=='1'){b.dataset.c='1';b.textContent='לאישור לחצו שוב';return}
      const x=await fetch('/api/results?key='+encodeURIComponent(r.key),{method:'DELETE',headers:hdr()});
      if(x.ok){rowsAll=rowsAll.filter(y=>y.key!==r.key);renderRows()}else b.textContent='שגיאה';
    };
    tr.insertCell().appendChild(b);
  });
}
$('csv').onclick=()=>{
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const lines=[['שם מלא','תאריך מילוי','P','A','E','I','סגנון בולט','סגנון משני']].concat(filtered().map(r=>{const T=r.totals||{};return [r.fullName,r.submittedAt,T.P,T.A,T.E,T.I,NAMES[r.dominant],NAMES[r.secondary]]}));
  const blob=new Blob(['\ufeff'+lines.map(l=>l.map(q).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='results.csv';document.body.appendChild(a);a.click();a.remove();
};
</script>
</body>
</html>
